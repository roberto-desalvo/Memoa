# Immagine del job di normalizzazione → GitHub Container Registry (privata) → Container Apps Job.
# Push su main → dev, push su prod → prod. Tag con lo SHA del commit (usato dal job) e con il nome del
# branch (da impostare in NORMALIZER_IMAGE_<ENV> per il deploy dell'infrastruttura, vedi infra/README.md).
name: Normalizer

on:
  push:
    branches: [main, prod]
    paths:
      - src/jobs/normalizer/**
      - src/shared/**
      - .github/workflows/normalizer.yml
      - .github/workflows/container-job-deploy.yml
  workflow_dispatch:

concurrency:
  group: normalizer-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # I nomi delle immagini su GHCR devono essere in minuscolo.
      - name: Nome dell'immagine
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memoa-normalizer" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Contesto src/: l'immagine include anche src/shared.
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/jobs/normalizer/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  dev:
    needs: image
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/container-job-deploy.yml
    with:
      environment: dev
      job: normalizer
      image: ${{ needs.image.outputs.image }}
    permissions:
      contents: read
      id-token: write

  prod:
    needs: image
    if: github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/container-job-deploy.yml
    with:
      environment: prod
      job: normalizer
      image: ${{ needs.image.outputs.image }}
    permissions:
      contents: read
      id-token: write
