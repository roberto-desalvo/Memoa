# Immagini del job di trascrizione, una per motore (Whisper, Parakeet e faster-whisper) → GitHub Container Registry
# (private) → Container Apps Job. Push su main → dev, push su prod → prod. Tag con lo SHA del commit (usato
# dal job) e con il nome del branch (da impostare in TRANSCRIBER_IMAGE_<ENV>,
# TRANSCRIBER_PARAKEET_IMAGE_<ENV> e TRANSCRIBER_FASTER_WHISPER_IMAGE_<ENV> per il deploy dell'infrastruttura, vedi infra/README.md). Il job viene
# aggiornato solo con l'immagine del motore che usa già: il motore lo sceglie il deploy dell'infrastruttura.
name: Transcriber

on:
  push:
    branches: [main, prod]
    paths:
      - src/jobs/transcriber/**
      - src/shared/**
      - .github/workflows/transcriber.yml
      - .github/workflows/container-job-deploy.yml
  workflow_dispatch:

concurrency:
  group: transcriber-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Target del Dockerfile e nome dell'immagine: Whisper mantiene il nome originale.
          - engine: whisper
            repository: memoa-transcriber
          - engine: parakeet
            repository: memoa-transcriber-parakeet
          - engine: faster-whisper
            repository: memoa-transcriber-faster-whisper
    steps:
      - uses: actions/checkout@v4

      # I nomi delle immagini su GHCR devono essere in minuscolo.
      - name: Nome dell'immagine
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.repository }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Contesto src/: l'immagine include anche src/shared.
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/jobs/transcriber/Dockerfile
          target: ${{ matrix.engine }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  # Le uscite di una matrice non si possono raccogliere per voce: i nomi si ricostruiscono qui.
  images:
    needs: image
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Elenco delle immagini
        id: list
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "list=ghcr.io/$owner/memoa-transcriber:$GITHUB_SHA ghcr.io/$owner/memoa-transcriber-parakeet:$GITHUB_SHA ghcr.io/$owner/memoa-transcriber-faster-whisper:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  dev:
    needs: images
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/container-job-deploy.yml
    with:
      environment: dev
      job: transcriber
      images: ${{ needs.images.outputs.list }}
    permissions:
      contents: read
      id-token: write

  prod:
    needs: images
    if: github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/container-job-deploy.yml
    with:
      environment: prod
      job: transcriber
      images: ${{ needs.images.outputs.list }}
    permissions:
      contents: read
      id-token: write
