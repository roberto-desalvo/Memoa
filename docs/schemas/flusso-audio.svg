<svg width="100%" viewBox="0 0 770 790" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flusso di una nota audio</title>
<desc>La PWA chiede il SAS a CreateAudioUpload, che crea il record e scrive un messaggio ritardato su upload-expiry; se il file non arriva, ExpireAudioUpload elimina il record. La PWA carica l'originale in uploads. L'evento "blob creato" attiva ValidateUpload, che scrive sulla coda normalization; la Function NormalizeRecord scrive in audio la copia Opus o un esito di errore. L'evento attiva EnqueueTranscription, che scrive sulla coda transcription; TranscribeRecord chiama Azure AI Speech, salva il testo nel database e scrive su indexing. In caso di ripiego scrive su transcription-fallback: il job Whisper scrive in transcripts e l'evento attiva EnqueueIndexing, che salva il testo e scrive su indexing. IndexRecord calcola gli embedding con Azure OpenAI e salva frammenti e stato in Azure SQL.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bg { fill: #ffffff; }
  .compute rect { fill: rgb(238, 237, 254); stroke: rgb(83, 74, 183); }
  .compute .t { fill: rgb(60, 52, 137); }
  .compute .s { fill: rgb(83, 74, 183); }
  .storage rect { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); }
  .storage .t { fill: rgb(8, 80, 65); }
  .storage .s { fill: rgb(15, 110, 86); }
  .external rect { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); }
  .external .t { fill: rgb(44, 44, 42); }
  .external .s { fill: rgb(82, 81, 78); }
  .t { font-size: 14px; font-weight: 500; }
  .s, .label { font-size: 12px; font-weight: 400; }
  .label { fill: rgb(68, 68, 65); paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .flow { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.5px; }
  .fallback { fill: none; stroke: rgb(163, 45, 45); stroke-width: 1.5px; }
  .event { fill: none; stroke: rgb(186, 117, 23); stroke-width: 1.5px; stroke-dasharray: 5 3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="770" height="790"/>

<!-- Riga 0: richiesta del SAS e scadenza dell'upload -->
<g class="compute"><rect x="30" y="40" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="58" text-anchor="middle" dominant-baseline="central">PWA</text><text class="s" x="105" y="78" text-anchor="middle" dominant-baseline="central">Registra o carica</text></g>
<g class="compute"><rect x="215" y="40" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="58" text-anchor="middle" dominant-baseline="central">CreateAudioUpload</text><text class="s" x="290" y="78" text-anchor="middle" dominant-baseline="central">Record e SAS</text></g>
<g class="storage"><rect x="400" y="40" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="475" y="58" text-anchor="middle" dominant-baseline="central">upload-expiry</text><text class="s" x="475" y="78" text-anchor="middle" dominant-baseline="central">Coda, ritardata</text></g>
<g class="compute"><rect x="585" y="40" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="660" y="58" text-anchor="middle" dominant-baseline="central">ExpireAudioUpload</text><text class="s" x="660" y="78" text-anchor="middle" dominant-baseline="central">Elimina se manca il file</text></g>
<line class="flow" x1="182" y1="68" x2="211" y2="68" marker-end="url(#arrow)"/>
<line class="flow" x1="367" y1="68" x2="396" y2="68" marker-end="url(#arrow)"/>
<line class="flow" x1="552" y1="68" x2="581" y2="68" marker-end="url(#arrow)"/>
<line class="flow" x1="105" y1="98" x2="105" y2="146" marker-end="url(#arrow)"/>
<text class="label" x="113" y="126">Upload con SAS</text>

<!-- Riga 1: validazione e normalizzazione -->
<g class="storage"><rect x="30" y="150" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="168" text-anchor="middle" dominant-baseline="central">uploads</text><text class="s" x="105" y="188" text-anchor="middle" dominant-baseline="central">Originali, mai cancellati</text></g>
<g class="compute"><rect x="215" y="150" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="168" text-anchor="middle" dominant-baseline="central">ValidateUpload</text><text class="s" x="290" y="188" text-anchor="middle" dominant-baseline="central">Dimensione, allegato</text></g>
<g class="storage"><rect x="400" y="150" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="475" y="168" text-anchor="middle" dominant-baseline="central">normalization</text><text class="s" x="475" y="188" text-anchor="middle" dominant-baseline="central">Coda, URL del blob</text></g>
<g class="compute"><rect x="585" y="150" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="660" y="168" text-anchor="middle" dominant-baseline="central">NormalizeRecord</text><text class="s" x="660" y="188" text-anchor="middle" dominant-baseline="central">Function, ffmpeg</text></g>
<line class="event" x1="182" y1="178" x2="211" y2="178" marker-end="url(#arrow)"/>
<line class="flow" x1="367" y1="178" x2="396" y2="178" marker-end="url(#arrow)"/>
<line class="flow" x1="552" y1="178" x2="581" y2="178" marker-end="url(#arrow)"/>
<path class="flow" d="M660 208 L660 233 L105 233 L105 256" marker-end="url(#arrow)"/>
<text class="label" x="382" y="227" text-anchor="middle">Copia .opus oppure esito .error.json</text>

<!-- Riga 2: trascrizione con Azure AI Speech -->
<g class="storage"><rect x="30" y="260" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="278" text-anchor="middle" dominant-baseline="central">audio</text><text class="s" x="105" y="298" text-anchor="middle" dominant-baseline="central">Opus normalizzato</text></g>
<g class="compute"><rect x="215" y="260" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="278" text-anchor="middle" dominant-baseline="central">EnqueueTranscription</text><text class="s" x="290" y="298" text-anchor="middle" dominant-baseline="central">Durata e percorso</text></g>
<g class="storage"><rect x="400" y="260" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="475" y="278" text-anchor="middle" dominant-baseline="central">transcription</text><text class="s" x="475" y="298" text-anchor="middle" dominant-baseline="central">Coda, URL e lingua</text></g>
<g class="compute"><rect x="585" y="260" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="660" y="278" text-anchor="middle" dominant-baseline="central">TranscribeRecord</text><text class="s" x="660" y="298" text-anchor="middle" dominant-baseline="central">Azure AI Speech</text></g>
<line class="event" x1="182" y1="288" x2="211" y2="288" marker-end="url(#arrow)"/>
<line class="flow" x1="367" y1="288" x2="396" y2="288" marker-end="url(#arrow)"/>
<line class="flow" x1="552" y1="288" x2="581" y2="288" marker-end="url(#arrow)"/>

<!-- Riga 3: ripiego con Whisper (da destra a sinistra) -->
<g class="storage"><rect x="585" y="370" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="660" y="388" text-anchor="middle" dominant-baseline="central">transcription-fallback</text><text class="s" x="660" y="408" text-anchor="middle" dominant-baseline="central">Coda di ripiego</text></g>
<g class="compute"><rect x="400" y="370" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="475" y="388" text-anchor="middle" dominant-baseline="central">Trascrizione</text><text class="s" x="475" y="408" text-anchor="middle" dominant-baseline="central">Job, Whisper</text></g>
<g class="storage"><rect x="215" y="370" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="388" text-anchor="middle" dominant-baseline="central">transcripts</text><text class="s" x="290" y="408" text-anchor="middle" dominant-baseline="central">.txt oppure .error.json</text></g>
<g class="compute"><rect x="30" y="370" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="388" text-anchor="middle" dominant-baseline="central">EnqueueIndexing</text><text class="s" x="105" y="408" text-anchor="middle" dominant-baseline="central">Salva il testo</text></g>
<line class="fallback" x1="660" y1="318" x2="660" y2="366" marker-end="url(#arrow)"/>
<text class="label" x="668" y="347">Ripiego</text>
<line class="fallback" x1="583" y1="398" x2="554" y2="398" marker-end="url(#arrow)"/>
<line class="fallback" x1="398" y1="398" x2="369" y2="398" marker-end="url(#arrow)"/>
<line class="event" x1="213" y1="398" x2="184" y2="398" marker-end="url(#arrow)"/>

<!-- Riga 4: indicizzazione -->
<g class="storage"><rect x="215" y="490" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="508" text-anchor="middle" dominant-baseline="central">indexing</text><text class="s" x="290" y="528" text-anchor="middle" dominant-baseline="central">Coda, solo RecordUid</text></g>
<g class="compute"><rect x="400" y="490" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="475" y="508" text-anchor="middle" dominant-baseline="central">IndexRecord</text><text class="s" x="475" y="528" text-anchor="middle" dominant-baseline="central">Frammenti ed embedding</text></g>
<g class="storage"><rect x="585" y="490" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="660" y="508" text-anchor="middle" dominant-baseline="central">Azure SQL</text><text class="s" x="660" y="528" text-anchor="middle" dominant-baseline="central">Testo, vettori, stato</text></g>
<g class="external"><rect x="400" y="600" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="475" y="618" text-anchor="middle" dominant-baseline="central">Azure OpenAI</text><text class="s" x="475" y="638" text-anchor="middle" dominant-baseline="central">text-embedding-3-small</text></g>
<!-- EnqueueIndexing → indexing -->
<path class="flow" d="M105 428 L105 518 L211 518" marker-end="url(#arrow)"/>
<!-- TranscribeRecord → indexing (trascrizione riuscita) -->
<path class="flow" d="M737 288 L755 288 L755 458 L290 458 L290 486" marker-end="url(#arrow)"/>
<text class="label" x="520" y="452" text-anchor="middle">Testo salvato nel database</text>
<line class="flow" x1="367" y1="518" x2="396" y2="518" marker-end="url(#arrow)"/>
<line class="flow" x1="552" y1="518" x2="581" y2="518" marker-end="url(#arrow)"/>
<line class="flow" x1="475" y1="548" x2="475" y2="596" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Note -->
<text class="label" x="30" y="690">Solo le Functions scrivono su code e database; il job di trascrizione legge solo la propria coda e scrive solo su Blob Storage.</text>
<text class="label" x="30" y="710">Note di testo: CreateTextRecord salva il testo in Azure SQL e scrive il RecordUid sulla coda indexing.</text>
<text class="label" x="30" y="730">Dettaglio della trascrizione in trascrizione.svg.</text>

<!-- Legenda -->
<g class="compute"><rect x="30" y="756" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="label" x="52" y="763" dominant-baseline="central">Calcolo</text>
<g class="storage"><rect x="120" y="756" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="label" x="142" y="763" dominant-baseline="central">Blob, code, database</text>
<g class="external"><rect x="276" y="756" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="label" x="298" y="763" dominant-baseline="central">Servizio esterno</text>
<line class="event" x1="412" y1="763" x2="442" y2="763" marker-end="url(#arrow)"/><text class="label" x="450" y="763" dominant-baseline="central">Evento "blob creato"</text>
<line class="fallback" x1="590" y1="763" x2="620" y2="763" marker-end="url(#arrow)"/><text class="label" x="628" y="763" dominant-baseline="central">Ripiego</text>
</svg>
