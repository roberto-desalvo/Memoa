<svg width="100%" viewBox="0 0 680 740" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Attori del sistema</title>
<desc>Utente ed Entra External ID fuori da Azure; dentro Azure West Europe: Static Web Apps, Azure Functions, Key Vault, storage dei dati, Event Grid, Azure SQL, Container Apps Job di normalizzazione e di trascrizione, Azure OpenAI, Application Insights, Cost Management; sotto, GitHub Actions e GHCR.</desc>
<style>
  text { font-family: anthropic-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .compute rect { fill: rgb(238, 237, 254); stroke: rgb(83, 74, 183); }
  .compute .t { fill: rgb(60, 52, 137); }
  .compute .s { fill: rgb(83, 74, 183); }
  .storage rect { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); }
  .storage .t { fill: rgb(8, 80, 65); }
  .storage .s { fill: rgb(15, 110, 86); }
  .external rect { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); }
  .external .t { fill: rgb(68, 68, 65); }
  .external .s { fill: rgb(95, 94, 90); }
  .t { font-size: 14px; font-weight: 500; }
  .s, .label { font-size: 12px; font-weight: 400; }
  .label { fill: rgb(82, 81, 78); }
  .region { fill: none; stroke: rgb(137, 135, 129); stroke-width: 0.5px; stroke-dasharray: 5 4; }
  .region-label { fill: rgb(11, 11, 11); font-size: 14px; font-weight: 500; }
  .flow { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.5px; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

