<svg width="100%" viewBox="0 0 680 840" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Trascrizione di una nota audio</title>
<desc>EnqueueTranscription, "riprova" e rigenerazione scrivono sulla coda transcription. TranscribeRecord ignora i record non più in elaborazione e chiama Azure AI Speech con un timeout di 30 secondi più 10 per minuto di audio. Se la trascrizione riesce salva testo e lingua in Azure SQL e scrive su indexing (testo vuoto: errore no_speech). Gli errori transitori fanno riprovare la coda fino a 5 volte. Timeout, risposte 429 o 413 e l'ultimo tentativo fallito inoltrano il messaggio su transcription-fallback: il job Whisper, solo per audio fino a 10 minuti, scrive in transcripts il testo o un esito di errore, e l'evento attiva EnqueueIndexing, che salva il testo e scrive su indexing oppure porta il record in errore.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bg { fill: #ffffff; }
  .compute rect { fill: rgb(238, 237, 254); stroke: rgb(83, 74, 183); }
  .compute .t { fill: rgb(60, 52, 137); }
  .compute .s { fill: rgb(83, 74, 183); }
  .storage rect { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); }
  .storage .t { fill: rgb(8, 80, 65); }
  .storage .s { fill: rgb(15, 110, 86); }
  .external rect { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); }
  .external .t { fill: rgb(44, 44, 42); }
  .external .s { fill: rgb(82, 81, 78); }
  .outcome rect { fill: #ffffff; stroke: rgb(137, 135, 129); stroke-dasharray: 3 3; }
  .outcome .t { fill: rgb(44, 44, 42); }
  .outcome .s { fill: rgb(82, 81, 78); }
  .t { font-size: 14px; font-weight: 500; }
  .s, .label { font-size: 12px; font-weight: 400; }
  .label { fill: rgb(68, 68, 65); paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .flow { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.5px; }
  .fallback { fill: none; stroke: rgb(163, 45, 45); stroke-width: 1.5px; }
  .event { fill: none; stroke: rgb(186, 117, 23); stroke-width: 1.5px; stroke-dasharray: 5 3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="840"/>

<!-- Origini dei messaggi -->
<g class="compute"><rect x="40" y="40" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="130" y="58" text-anchor="middle" dominant-baseline="central">EnqueueTranscription</text><text class="s" x="130" y="78" text-anchor="middle" dominant-baseline="central">Copia normalizzata pronta</text></g>
<g class="compute"><rect x="250" y="40" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="58" text-anchor="middle" dominant-baseline="central">RetryRecord</text><text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central">"Riprova" dall'app</text></g>
<g class="compute"><rect x="460" y="40" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="550" y="58" text-anchor="middle" dominant-baseline="central">RegenerateTranscript</text><text class="s" x="550" y="78" text-anchor="middle" dominant-baseline="central">Rigenerazione dall'app</text></g>
<path class="flow" d="M130 98 L130 120 L300 120 L300 146" marker-end="url(#arrow)"/>
<line class="flow" x1="340" y1="98" x2="340" y2="146" marker-end="url(#arrow)"/>
<path class="flow" d="M550 98 L550 120 L380 120 L380 146" marker-end="url(#arrow)"/>

<!-- Coda e Function -->
<g class="storage"><rect x="250" y="150" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="168" text-anchor="middle" dominant-baseline="central">transcription</text><text class="s" x="340" y="188" text-anchor="middle" dominant-baseline="central">Coda, URL e lingua dell'account</text></g>
<line class="flow" x1="340" y1="208" x2="340" y2="246" marker-end="url(#arrow)"/>
<g class="compute"><rect x="190" y="250" width="300" height="64" rx="8" stroke-width="0.5"/><text class="t" x="340" y="270" text-anchor="middle" dominant-baseline="central">TranscribeRecord</text><text class="s" x="340" y="292" text-anchor="middle" dominant-baseline="central">Timeout: 30 s + 10 s per minuto di audio</text></g>
<g class="external"><rect x="520" y="254" width="140" height="56" rx="8" stroke-width="0.5"/><text class="t" x="590" y="272" text-anchor="middle" dominant-baseline="central">Azure AI Speech</text><text class="s" x="590" y="292" text-anchor="middle" dominant-baseline="central">it-IT, en-US</text></g>
<line class="flow" x1="492" y1="282" x2="516" y2="282" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="label" x="20" y="268">Record non più in</text>
<text class="label" x="20" y="284">elaborazione: ignorato.</text>
<text class="label" x="20" y="300">Già trascritto: solo indexing.</text>

<!-- Esiti -->
<path class="flow" d="M260 316 L260 340 L130 340 L130 376" marker-end="url(#arrow)"/>
<line class="flow" x1="340" y1="316" x2="340" y2="376" marker-end="url(#arrow)"/>
<path class="fallback" d="M420 316 L420 340 L550 340 L550 376" marker-end="url(#arrow)"/>

<g class="storage"><rect x="40" y="380" width="180" height="64" rx="8" stroke-width="0.5"/><text class="t" x="130" y="400" text-anchor="middle" dominant-baseline="central">Azure SQL</text><text class="s" x="130" y="420" text-anchor="middle" dominant-baseline="central">Text, OriginalTranscript,</text><text class="s" x="130" y="434" text-anchor="middle" dominant-baseline="central">Language</text></g>
<g class="outcome"><rect x="250" y="380" width="180" height="64" rx="8" stroke-width="0.75"/><text class="t" x="340" y="400" text-anchor="middle" dominant-baseline="central">Errore transitorio</text><text class="s" x="340" y="420" text-anchor="middle" dominant-baseline="central">5xx, rete: la coda riprova</text><text class="s" x="340" y="434" text-anchor="middle" dominant-baseline="central">fino a 5 consegne</text></g>
<g class="storage"><rect x="460" y="380" width="180" height="64" rx="8" stroke-width="0.5"/><text class="t" x="550" y="400" text-anchor="middle" dominant-baseline="central">transcription-fallback</text><text class="s" x="550" y="420" text-anchor="middle" dominant-baseline="central">Stesso messaggio</text><text class="s" x="550" y="434" text-anchor="middle" dominant-baseline="central">della coda principale</text></g>
<text class="label" x="138" y="334" text-anchor="end">Riuscita</text>
<text class="label" x="560" y="334">Timeout, 429/413,</text>
<text class="label" x="560" y="350">ultimo tentativo</text>

<!-- Ramo riuscito -->
<line class="flow" x1="130" y1="446" x2="130" y2="606" marker-end="url(#arrow)"/>
<text class="label" x="138" y="500">Testo vuoto: in errore</text>
<text class="label" x="138" y="516">con no_speech</text>

<!-- Ramo di ripiego -->
<line class="fallback" x1="550" y1="446" x2="550" y2="486" marker-end="url(#arrow)"/>
<g class="compute"><rect x="460" y="490" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="550" y="508" text-anchor="middle" dominant-baseline="central">Job trascrizione</text><text class="s" x="550" y="528" text-anchor="middle" dominant-baseline="central">Whisper, fino a 10 minuti</text></g>
<line class="fallback" x1="550" y1="548" x2="550" y2="606" marker-end="url(#arrow)"/>
<g class="storage"><rect x="460" y="610" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="550" y="628" text-anchor="middle" dominant-baseline="central">transcripts</text><text class="s" x="550" y="648" text-anchor="middle" dominant-baseline="central">.txt oppure .error.json</text></g>
<line class="event" x1="458" y1="638" x2="434" y2="638" marker-end="url(#arrow)"/>
<g class="compute"><rect x="250" y="610" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="628" text-anchor="middle" dominant-baseline="central">EnqueueIndexing</text><text class="s" x="340" y="648" text-anchor="middle" dominant-baseline="central">Testo nel database</text></g>
<line class="flow" x1="248" y1="638" x2="224" y2="638" marker-end="url(#arrow)"/>
<text class="label" x="340" y="690" text-anchor="middle">Esito di errore: record in errore</text>
<text class="label" x="550" y="690" text-anchor="middle">Oltre 10 minuti: audio_too_long</text>

<g class="storage"><rect x="40" y="610" width="180" height="56" rx="8" stroke-width="0.5"/><text class="t" x="130" y="628" text-anchor="middle" dominant-baseline="central">indexing</text><text class="s" x="130" y="648" text-anchor="middle" dominant-baseline="central">Coda, solo RecordUid</text></g>

<!-- Note -->
<text class="label" x="40" y="740">Il motore sta dietro ITranscriber (Function) e ITranscriptionEngine (job): sostituibili.</text>
<text class="label" x="40" y="760">Il file in transcripts esiste solo quando trascrive il job.</text>

<!-- Legenda -->
<g class="compute"><rect x="40" y="796" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="label" x="62" y="803" dominant-baseline="central">Calcolo</text>
<g class="storage"><rect x="130" y="796" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="label" x="152" y="803" dominant-baseline="central">Code, blob, database</text>
<line class="fallback" x1="296" y1="803" x2="326" y2="803" marker-end="url(#arrow)"/><text class="label" x="334" y="803" dominant-baseline="central">Ripiego</text>
<line class="event" x1="410" y1="803" x2="440" y2="803" marker-end="url(#arrow)"/><text class="label" x="448" y="803" dominant-baseline="central">Evento "blob creato"</text>
</svg>
