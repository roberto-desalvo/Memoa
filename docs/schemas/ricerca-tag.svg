<svg width="100%" viewBox="0 0 770 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Ricerca semantica e tag automatici</title>
<desc>IndexRecord divide il testo di una nota in frammenti, ne calcola gli embedding con Azure OpenAI e li salva in Azure SQL come VECTOR(1536). Search calcola l'embedding della query e cerca i frammenti più simili con VECTOR_DISTANCE. CreateTag e UpdateTag calcolano l'embedding di nome e descrizione del tag. La coda tagging attiva TagRecords, che assegna i tag confrontando i vettori già salvati in Azure SQL, senza chiamate ad Azure OpenAI.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bg { fill: #ffffff; }
  .compute rect { fill: rgb(238, 237, 254); stroke: rgb(83, 74, 183); }
  .compute .t { fill: rgb(60, 52, 137); }
  .compute .s { fill: rgb(83, 74, 183); }
  .storage rect { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); }
  .storage .t { fill: rgb(8, 80, 65); }
  .storage .s { fill: rgb(15, 110, 86); }
  .external rect { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); }
  .external .t { fill: rgb(44, 44, 42); }
  .external .s { fill: rgb(82, 81, 78); }
  .t { font-size: 14px; font-weight: 500; }
  .s, .label { font-size: 12px; font-weight: 400; }
  .label { fill: rgb(68, 68, 65); paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .head { fill: rgb(11, 11, 11); font-size: 14px; font-weight: 500; }
  .region { fill: none; stroke: rgb(137, 135, 129); stroke-width: 0.75px; stroke-dasharray: 5 4; }
  .region-label { fill: rgb(11, 11, 11); font-size: 14px; font-weight: 500; }
  .flow { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.5px; }
  .fallback { fill: none; stroke: rgb(163, 45, 45); stroke-width: 1.5px; }
  .event { fill: none; stroke: rgb(186, 117, 23); stroke-width: 1.5px; stroke-dasharray: 5 3; }
  .aux { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.2px; stroke-dasharray: 2 3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="770" height="620"/>
<text class="head" x="30" y="30">Ogni testo diventa un vettore dello stesso modello: ricerca e tag sono confronti tra vettori in Azure SQL</text>
<g class="storage"><rect x="30" y="70" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="88" text-anchor="middle" dominant-baseline="central">indexing</text><text class="s" x="105" y="108" text-anchor="middle" dominant-baseline="central">Nota da indicizzare</text></g>
<g class="compute"><rect x="215" y="70" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="88" text-anchor="middle" dominant-baseline="central">IndexRecord</text><text class="s" x="290" y="108" text-anchor="middle" dominant-baseline="central">Testo in frammenti</text></g>
<g class="external"><rect x="30" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="198" text-anchor="middle" dominant-baseline="central">Query di ricerca</text><text class="s" x="105" y="218" text-anchor="middle" dominant-baseline="central">Dalla PWA</text></g>
<g class="compute"><rect x="215" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="198" text-anchor="middle" dominant-baseline="central">Search</text><text class="s" x="290" y="218" text-anchor="middle" dominant-baseline="central">Embedding della query</text></g>
<g class="external"><rect x="30" y="290" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="308" text-anchor="middle" dominant-baseline="central">Tag dell'utente</text><text class="s" x="105" y="328" text-anchor="middle" dominant-baseline="central">Nome e descrizione</text></g>
<g class="compute"><rect x="215" y="290" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="308" text-anchor="middle" dominant-baseline="central">CreateTag, UpdateTag</text><text class="s" x="290" y="328" text-anchor="middle" dominant-baseline="central">Embedding del tag</text></g>
<g class="external"><rect x="400" y="70" width="150" height="276" rx="8" stroke-width="0.5"/><text class="t" x="475" y="178" text-anchor="middle" dominant-baseline="central">Azure OpenAI</text><text class="s" x="475" y="198" text-anchor="middle" dominant-baseline="central">text-embedding-3-small</text><text class="s" x="475" y="214" text-anchor="middle" dominant-baseline="central">multilingue</text><text class="s" x="475" y="230" text-anchor="middle" dominant-baseline="central">1536 dimensioni</text></g>
<g class="storage"><rect x="585" y="70" width="150" height="386" rx="8" stroke-width="0.5"/><text class="t" x="660" y="223" text-anchor="middle" dominant-baseline="central">Azure SQL</text><text class="s" x="660" y="243" text-anchor="middle" dominant-baseline="central">Tipo VECTOR(1536)</text><text class="s" x="660" y="259" text-anchor="middle" dominant-baseline="central">frammenti delle note</text><text class="s" x="660" y="275" text-anchor="middle" dominant-baseline="central">e vettori dei tag</text><text class="s" x="660" y="291" text-anchor="middle" dominant-baseline="central">con il nome del modello</text></g>
<path class="flow" d="M182 98 L211 98" marker-end="url(#arrow)"/>
<path class="flow" d="M367 98 L396 98" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="flow" d="M552 98 L581 98" marker-end="url(#arrow)"/>
<path class="flow" d="M182 208 L211 208" marker-end="url(#arrow)"/>
<path class="flow" d="M367 208 L396 208" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="flow" d="M552 208 L581 208" marker-end="url(#arrow)"/>
<path class="flow" d="M182 318 L211 318" marker-end="url(#arrow)"/>
<path class="flow" d="M367 318 L396 318" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="flow" d="M552 318 L581 318" marker-end="url(#arrow)"/>
<text class="label" x="568" y="90" text-anchor="middle">Salva</text>
<text class="label" x="568" y="200" text-anchor="middle">Cerca</text>
<text class="label" x="568" y="310" text-anchor="middle">Salva</text>
<!-- Assegnazione automatica dei tag -->
<g class="storage"><rect x="30" y="400" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="105" y="418" text-anchor="middle" dominant-baseline="central">tagging</text><text class="s" x="105" y="438" text-anchor="middle" dominant-baseline="central">RecordUid o TagUid</text></g>
<g class="compute"><rect x="215" y="400" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="290" y="418" text-anchor="middle" dominant-baseline="central">TagRecords</text><text class="s" x="290" y="438" text-anchor="middle" dominant-baseline="central">Similarità ≥ soglia</text></g>
<path class="flow" d="M182 428 L211 428" marker-end="url(#arrow)"/>
<path class="flow" d="M367 428 L581 428" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="label" x="475" y="420" text-anchor="middle">Solo SQL, nessuna chiamata AI</text>
<path class="flow" d="M290 348 L290 364 L105 364 L105 396" marker-end="url(#arrow)"/>
<text class="label" x="198" y="358" text-anchor="middle">Tag nuovo o modificato</text>
<path class="flow" d="M290 68 L290 56 L14 56 L14 428 L26 428" marker-end="url(#arrow)"/>
<text class="label" x="10" y="260" text-anchor="middle" transform="rotate(-90 10 260)">Dopo l'indicizzazione</text>
<text class="label" x="30" y="500" text-anchor="start">Ricerca: VECTOR_DISTANCE (coseno) tra la query e tutti i frammenti dell'utente; i più simili, sopra la soglia e al massimo 10,</text>
<text class="label" x="30" y="518" text-anchor="start">tornano alla PWA con il link alla nota. Il modello è multilingue: una query in inglese trova note in italiano.</text>
<text class="label" x="30" y="542" text-anchor="start">Tag: assegnato se almeno un frammento della nota supera la soglia di similarità con nome e descrizione del tag.</text>
<text class="label" x="30" y="560" text-anchor="start">Un tag aggiunto a mano resta, uno tolto a mano non viene più riassegnato in automatico.</text>
<g class="compute"><rect x="30" y="589" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="52" y="596" dominant-baseline="central">Functions</text>
<g class="storage"><rect x="123.6" y="589" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="145.6" y="596" dominant-baseline="central">Code e database</text>
<g class="external"><rect x="255.6" y="589" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="277.6" y="596" dominant-baseline="central">Ingressi e servizio AI</text>
</svg>
