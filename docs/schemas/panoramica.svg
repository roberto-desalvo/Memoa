<svg width="100%" viewBox="0 0 770 780" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Panoramica dell'architettura di Memoa</title>
<desc>L'utente si autentica con Entra External ID, scarica la PWA da Static Web Apps, chiama le Azure Functions con il token e carica i file direttamente su Blob Storage con un SAS. L'evento "blob creato" passa da Event Grid alle Functions, che usano le Storage Queues per ogni passaggio e chiamano Azure AI Speech, Azure OpenAI e Azure SQL. In caso di ripiego una coda avvia il Container Apps Job, che scrive la trascrizione su Blob Storage. Key Vault contiene solo il token GHCR del job; GitHub Actions distribuisce con OIDC e GHCR ospita le immagini del job.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bg { fill: #ffffff; }
  .compute rect { fill: rgb(238, 237, 254); stroke: rgb(83, 74, 183); }
  .compute .t { fill: rgb(60, 52, 137); }
  .compute .s { fill: rgb(83, 74, 183); }
  .storage rect { fill: rgb(225, 245, 238); stroke: rgb(15, 110, 86); }
  .storage .t { fill: rgb(8, 80, 65); }
  .storage .s { fill: rgb(15, 110, 86); }
  .external rect { fill: rgb(241, 239, 232); stroke: rgb(95, 94, 90); }
  .external .t { fill: rgb(44, 44, 42); }
  .external .s { fill: rgb(82, 81, 78); }
  .t { font-size: 14px; font-weight: 500; }
  .s, .label { font-size: 12px; font-weight: 400; }
  .label { fill: rgb(68, 68, 65); paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .head { fill: rgb(11, 11, 11); font-size: 14px; font-weight: 500; }
  .region { fill: none; stroke: rgb(137, 135, 129); stroke-width: 0.75px; stroke-dasharray: 5 4; }
  .region-label { fill: rgb(11, 11, 11); font-size: 14px; font-weight: 500; }
  .flow { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.5px; }
  .fallback { fill: none; stroke: rgb(163, 45, 45); stroke-width: 1.5px; }
  .event { fill: none; stroke: rgb(186, 117, 23); stroke-width: 1.5px; stroke-dasharray: 5 3; }
  .aux { fill: none; stroke: rgb(137, 135, 129); stroke-width: 1.2px; stroke-dasharray: 2 3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="770" height="780"/>
<!-- Fuori da Azure -->
<g class="external"><rect x="90" y="30" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="170" y="48" text-anchor="middle" dominant-baseline="central">Utente</text><text class="s" x="170" y="68" text-anchor="middle" dominant-baseline="central">PWA o APK Android</text></g>
<g class="external"><rect x="550" y="30" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="630" y="48" text-anchor="middle" dominant-baseline="central">Entra External ID</text><text class="s" x="630" y="68" text-anchor="middle" dominant-baseline="central">Un tenant per ambiente</text></g>
<path class="flow" d="M252 58 L546 58" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="label" x="405" y="50" text-anchor="middle">Login (MSAL), token</text>
<!-- Regione Azure -->
<rect class="region" x="45" y="98" width="690" height="488" rx="16"/>
<text class="region-label" x="719" y="128" text-anchor="end">Azure · West Europe</text>
<g class="compute"><rect x="90" y="150" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="170" y="168" text-anchor="middle" dominant-baseline="central">Static Web Apps</text><text class="s" x="170" y="188" text-anchor="middle" dominant-baseline="central">Frontend Angular</text></g>
<g class="compute"><rect x="320" y="150" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="400" y="168" text-anchor="middle" dominant-baseline="central">Azure Functions</text><text class="s" x="400" y="188" text-anchor="middle" dominant-baseline="central">.NET 10, Flex Consumption</text></g>
<g class="compute"><rect x="550" y="150" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="630" y="168" text-anchor="middle" dominant-baseline="central">Azure AI Speech</text><text class="s" x="630" y="188" text-anchor="middle" dominant-baseline="central">Fast transcription</text></g>
<g class="storage"><rect x="90" y="270" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="170" y="288" text-anchor="middle" dominant-baseline="central">Event Grid</text><text class="s" x="170" y="308" text-anchor="middle" dominant-baseline="central">Eventi "blob creato"</text></g>
<g class="storage"><rect x="320" y="270" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="400" y="288" text-anchor="middle" dominant-baseline="central">Storage Queues</text><text class="s" x="400" y="308" text-anchor="middle" dominant-baseline="central">Una coda per passaggio</text></g>
<g class="compute"><rect x="550" y="270" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="630" y="288" text-anchor="middle" dominant-baseline="central">Azure OpenAI</text><text class="s" x="630" y="308" text-anchor="middle" dominant-baseline="central">Embedding, Data Zone EU</text></g>
<g class="storage"><rect x="90" y="390" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="170" y="408" text-anchor="middle" dominant-baseline="central">Blob Storage</text><text class="s" x="170" y="428" text-anchor="middle" dominant-baseline="central">Audio, documenti, testi</text></g>
<g class="compute"><rect x="320" y="390" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="400" y="408" text-anchor="middle" dominant-baseline="central">Container Apps Job</text><text class="s" x="400" y="428" text-anchor="middle" dominant-baseline="central">Trascrizione di ripiego</text></g>
<g class="storage"><rect x="550" y="390" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="630" y="408" text-anchor="middle" dominant-baseline="central">Azure SQL</text><text class="s" x="630" y="428" text-anchor="middle" dominant-baseline="central">Dati e VECTOR(1536)</text></g>
<g class="external"><rect x="90" y="510" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="170" y="528" text-anchor="middle" dominant-baseline="central">Application Insights</text><text class="s" x="170" y="548" text-anchor="middle" dominant-baseline="central">OpenTelemetry</text></g>
<g class="storage"><rect x="320" y="510" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="400" y="528" text-anchor="middle" dominant-baseline="central">Key Vault</text><text class="s" x="400" y="548" text-anchor="middle" dominant-baseline="central">Solo il token GHCR</text></g>
<g class="external"><rect x="550" y="510" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="630" y="528" text-anchor="middle" dominant-baseline="central">Cost Management</text><text class="s" x="630" y="548" text-anchor="middle" dominant-baseline="central">Budget e avvisi</text></g>
<!-- Utente: app, API, upload diretto -->
<path class="flow" d="M150 88 L150 146" marker-end="url(#arrow)"/>
<text class="label" x="158" y="128" text-anchor="start">App</text>
<path class="flow" d="M220 88 L220 124 L400 124 L400 146" marker-end="url(#arrow)"/>
<text class="label" x="310" y="118" text-anchor="middle">API con token</text>
<path class="flow" d="M88 58 L66 58 L66 418 L86 418" marker-end="url(#arrow)"/>
<text class="label" x="60" y="330" text-anchor="middle" transform="rotate(-90 60 330)">Upload diretto con SAS</text>
<!-- Pipeline a eventi -->
<path class="event" d="M170 388 L170 330" marker-end="url(#arrow)"/>
<text class="label" x="178" y="363" text-anchor="start">Blob creato</text>
<path class="event" d="M252 298 L285 298 L285 190 L316 190" marker-end="url(#arrow)"/>
<path class="flow" d="M400 208 L400 266" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="label" x="408" y="241" text-anchor="start">Code</text>
<path class="fallback" d="M400 328 L400 386" marker-end="url(#arrow)"/>
<text class="label" x="408" y="361" text-anchor="start">Ripiego (KEDA)</text>
<path class="flow" d="M318 418 L254 418" marker-end="url(#arrow)"/>
<text class="label" x="287" y="410" text-anchor="middle">.txt</text>
<!-- Functions verso servizi AI e database -->
<path class="flow" d="M482 166 L546 166" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="flow" d="M482 184 L528 184 L528 298 L546 298" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="flow" d="M482 200 L508 200 L508 418 L546 418" marker-end="url(#arrow)"/>
<!-- Segreti, immagini e deploy -->
<path class="aux" d="M400 506 L400 448" marker-end="url(#arrow)"/>
<text class="label" x="408" y="482" text-anchor="start">Token GHCR</text>
<g class="external"><rect x="90" y="610" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="170" y="628" text-anchor="middle" dominant-baseline="central">GitHub Actions</text><text class="s" x="170" y="648" text-anchor="middle" dominant-baseline="central">CI/CD con OIDC</text></g>
<g class="external"><rect x="320" y="610" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="400" y="628" text-anchor="middle" dominant-baseline="central">GHCR</text><text class="s" x="400" y="648" text-anchor="middle" dominant-baseline="central">Immagini del job</text></g>
<path class="aux" d="M170 608 L170 590" marker-end="url(#arrow)"/>
<text class="label" x="180" y="602" text-anchor="start">Deploy</text>
<path class="aux" d="M482 638 L494 638 L494 436 L484 436" marker-end="url(#arrow)"/>
<text class="label" x="502" y="600" text-anchor="start">Immagine</text>
<text class="label" x="30" y="700" text-anchor="start">Solo le Functions scrivono su database e code. Ogni componente ha la propria identità gestita, con il minimo dei permessi.</text>
<text class="label" x="30" y="720" text-anchor="start">Functions e job inviano log e tracce ad Application Insights. Dettaglio delle risorse in architettura.svg.</text>
<g class="compute"><rect x="30" y="745" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="52" y="752" dominant-baseline="central">Calcolo e AI</text>
<g class="storage"><rect x="142.8" y="745" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="164.8" y="752" dominant-baseline="central">Dati ed eventi</text>
<g class="external"><rect x="268.40000000000003" y="745" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="290.40000000000003" y="752" dominant-baseline="central">Esterni e supporto</text>
<line class="event" x1="419.6" y1="752" x2="449.6" y2="752" marker-end="url(#arrow)"/>
<text class="label" x="457.6" y="752" dominant-baseline="central">Evento</text>
<line class="fallback" x1="510.0" y1="752" x2="540.0" y2="752" marker-end="url(#arrow)"/>
<text class="label" x="548.0" y="752" dominant-baseline="central">Ripiego</text>
<line class="aux" x1="606.8" y1="752" x2="636.8" y2="752" marker-end="url(#arrow)"/>
<text class="label" x="644.8" y="752" dominant-baseline="central">Supporto</text>
</svg>
