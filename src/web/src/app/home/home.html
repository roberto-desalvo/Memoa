<header>
  <h1>Memoa</h1>
  <div class="account">
    @if (accountName) {
      <span>{{ accountName }}</span>
    }
    <button type="button" (click)="logout()">Esci</button>
  </div>
</header>

<main>
  <h2>Risposta di <code>GET /api/me</code></h2>

  @if (me.isLoading()) {
    <p>Chiamata in corso…</p>
  } @else if (me.error(); as error) {
    <pre class="error">{{ error | json }}</pre>
  } @else {
    <pre>{{ me.value() | json }}</pre>
  }

  <button type="button" (click)="me.reload()" [disabled]="me.isLoading()">Riprova</button>
</main>
