@if (supported) {
  <button
    type="button"
    class="record"
    [class.active]="recording()"
    [attr.aria-label]="recording() ? 'Ferma la registrazione' : 'Registra'"
    (click)="toggle()"
  >
    @if (recording()) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" />
        <path
          d="M19 11a7 7 0 0 1-14 0M12 18v3"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    }
  </button>
} @else {
  <p class="error">Il browser non supporta la registrazione audio.</p>
}

<div class="message" aria-live="polite">
  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  } @else if (recording()) {
    <p class="timer">{{ elapsed() }} / {{ maxDuration }}</p>
  } @else if (supported) {
    <p>Tocca per registrare (massimo {{ maxDuration }}).</p>
  }
</div>
